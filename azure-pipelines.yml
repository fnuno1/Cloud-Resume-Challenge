# ============================================================
# Cloud Resume Challenge — Azure DevOps CI/CD Pipeline
# ============================================================
# Author:      Fabian Nuno
# Org:         dev.azure.com/nufaze84
# Project:     Cloud_Resume-Challenge
# Target:      Azure Static Web App — fabian-resume-site
# Live URL:    https://fabianresume.dev
# ============================================================
#
# HOW THIS PIPELINE WORKS:
# ---------------------------------------------------------------
# This pipeline has two stages: Validate and Deploy.
#
# VALIDATE runs automatically on every PR targeting main and on
# every push to main. It checks that the required files exist,
# that internal references are intact, and that the HTML file
# is not empty or corrupt. This is a safety gate — it catches
# problems before they ever reach production.
#
# DEPLOY runs only after Validate passes AND the change has been
# merged into main (not on a PR). It is guarded by a manual
# approval gate configured in the Azure DevOps "production"
# environment. You must explicitly approve before files go live.
# The approval gate has a 3-day (4320 minute) timeout — if not
# approved within 3 days the deployment auto-cancels.
#
# VARIABLE GROUP:
# The pipeline reads secrets from a variable group named
# "cloud-resume-secrets" stored in Pipelines → Library.
# That group contains the Static Web App deployment token
# (AZURE_STATIC_WEB_APPS_API_TOKEN) which authenticates the
# deployment to Azure without exposing credentials in code.
#
# LINE ENDINGS:
# A .gitattributes file at the repo root enforces LF line endings
# for all HTML, CSS, JS, YAML, and MD files. This prevents git's
# automatic CRLF conversion on Windows from corrupting files
# during checkout. Never remove .gitattributes from this repo.
#
# WHY WE USE SWA CLI INSTEAD OF AzureStaticWebApp@0 TASK:
# ---------------------------------------------------------------
# The AzureStaticWebApp@0 Microsoft task was our original deploy
# method. It failed with "No matching Static Web App was found"
# because Azure Static Web Apps requires a repository linkage
# (GitHub or Azure DevOps) when using that task. The task cannot
# deploy to a Static Web App that has no registered source repo.
#
# We disconnected the GitHub source using:
#   az staticwebapp disconnect --name fabian-resume-site \
#     --resource-group cloud-resume-challenge
#
# After disconnecting, the AzureStaticWebApp@0 task continued to
# fail because Azure Static Web Apps enforces repo linkage at the
# platform level when using that task — even with a valid token.
#
# SOLUTION: Azure Static Web Apps CLI (swa deploy)
# The SWA CLI authenticates purely via deployment token with no
# repository linkage required. This gives us full control over
# the deployment pipeline without Azure managing it for us.
# This is the professional approach for custom CI/CD pipelines.
#
# The original AzureStaticWebApp@0 task is preserved below as a
# commented-out reference so the architectural decision is clear.
#
# --env DEFAULT vs --env PRODUCTION:
# ---------------------------------------------------------------
# After switching to swa CLI we still hit "No matching Static Web
# App was found". Root cause discovered via:
#   az staticwebapp environment list --name fabian-resume-site
# The command returned Name: "default" — not "production".
# Azure names the production slot "default" when the Static Web
# App is not linked to a source repo. Using --env production
# failed because that environment name does not exist.
# Fix: use --env default which maps to the actual production slot.
# ============================================================

# ---------------------------------------------------------------
# TRIGGER — when does this pipeline run automatically?
# ---------------------------------------------------------------
trigger:
  branches:
    include:
      - main          # Only trigger on pushes to main (not feature branches)
  paths:
    include:
      - frontend/**           # Any change inside the frontend folder
      - azure-pipelines.yml   # Changes to the pipeline itself also trigger a run

# ---------------------------------------------------------------
# PR TRIGGER — runs Validate on every pull request into main
# This gives you a green/red check on the PR before you merge
# ---------------------------------------------------------------
pr:
  branches:
    include:
      - main          # Watch PRs targeting main only
  paths:
    include:
      - frontend/**   # Only care about frontend changes in PRs

# ---------------------------------------------------------------
# VARIABLES
# ---------------------------------------------------------------
variables:
  # Pull in the secret variable group from Pipelines → Library
  # This group contains AZURE_STATIC_WEB_APPS_API_TOKEN (secret)
  # which is the deployment token for fabian-resume-site
  - group: cloud-resume-secrets

  # The folder that contains index.html, style.css, and images/
  # Referenced throughout the pipeline as $(frontendPath)
  - name: frontendPath
    value: 'frontend'

# ============================================================
# STAGES
# ============================================================
stages:

# ---------------------------------------------------------------
# STAGE 1: VALIDATE
# Runs on every PR and every push to main.
# Does NOT deploy anything — purely checks file integrity.
# If any step fails, the pipeline stops and Deploy never runs.
# ---------------------------------------------------------------
- stage: Validate
  displayName: 'Validate'
  jobs:

  - job: HTMLLint
    displayName: 'HTML & CSS Validation'
    pool:
      vmImage: 'ubuntu-latest'   # Fresh Linux agent for each run

    steps:

    # Pull the repo code onto the agent so we can inspect files
    - checkout: self
      displayName: 'Checkout source'

    # -------------------------------------------------------
    # STEP 1: Verify required files exist
    # Fails immediately if index.html or style.css are missing.
    # ##vso[task.logissue] writes a visible error in the UI.
    # -------------------------------------------------------
    - script: |
        echo "=== Checking for required files ==="

        # Verify main HTML file exists
        if [ ! -f "$(frontendPath)/index.html" ]; then
          echo "##vso[task.logissue type=error]index.html not found in frontend/"
          exit 1
        fi
        echo "✓ index.html found"

        # Verify stylesheet exists
        if [ ! -f "$(frontendPath)/style.css" ]; then
          echo "##vso[task.logissue type=error]style.css not found in frontend/"
          exit 1
        fi
        echo "✓ style.css found"

        # Warn if images folder is missing — won't block deploy but
        # will cause broken cert logo images on the live site
        if [ ! -d "$(frontendPath)/images" ]; then
          echo "##vso[task.logissue type=warning]images/ directory not found — cert logos may be broken"
        else
          echo "✓ images/ directory found"
        fi
      displayName: 'Verify required files exist'

    # -------------------------------------------------------
    # STEP 2: Internal reference checks
    # Verifies CSS link in HTML points to an existing file,
    # and that the visitor counter API URL is still present.
    # continueOnError: true — warnings don't block the pipeline
    # -------------------------------------------------------
    - script: |
        echo "=== Internal reference checks ==="

        # Extract CSS href from the <link> tag in index.html
        CSS_REF=$(grep -o 'href="[^"]*\.css"' $(frontendPath)/index.html | head -1 | sed 's/href="//;s/"//')

        # Warn if CSS file referenced in HTML doesn't exist on disk
        if [ -n "$CSS_REF" ] && [ ! -f "$(frontendPath)/$CSS_REF" ]; then
          echo "##vso[task.logissue type=warning]CSS reference '$CSS_REF' not found"
        else
          echo "✓ CSS reference check passed"
        fi

        # Confirm visitor counter API endpoint is still in the HTML
        if grep -q "azurewebsites.net" "$(frontendPath)/index.html"; then
          echo "✓ Visitor counter API endpoint found"
        else
          echo "##vso[task.logissue type=warning]Visitor counter API URL missing — counter may be broken"
        fi
      displayName: 'Internal reference checks'
      continueOnError: true

    # -------------------------------------------------------
    # STEP 3: File size sanity check
    # A valid index.html must be at least 500 bytes.
    # Catches accidental empty file commits.
    # -------------------------------------------------------
    - script: |
        echo "=== File size check ==="

        HTML_SIZE=$(wc -c < "$(frontendPath)/index.html")
        CSS_SIZE=$(wc -c < "$(frontendPath)/style.css")

        echo "index.html: ${HTML_SIZE} bytes"
        echo "style.css:  ${CSS_SIZE} bytes"

        if [ "$HTML_SIZE" -lt 500 ]; then
          echo "##vso[task.logissue type=error]index.html is ${HTML_SIZE} bytes — appears empty or corrupt"
          exit 1
        fi

        echo "✓ File size checks passed"
      displayName: 'File size sanity check'

# ---------------------------------------------------------------
# STAGE 2: DEPLOY
# Deploys frontend/ to Azure Static Web Apps using swa CLI.
#
# CONDITIONS — only runs when ALL of these are true:
#   1. Validate stage passed
#   2. Source branch is main (not a feature branch)
#   3. This is NOT a PR build
#
# APPROVAL GATE: configured in Pipelines → Environments → production
#   - Required approver: nufaze84
#   - Timeout: 3 days (4320 minutes) — auto-cancels if not approved
# ---------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to Azure Static Web Apps'
  dependsOn: Validate

  condition: |
    and(
      succeeded('Validate'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:

  - deployment: DeployFrontend
    displayName: 'Deploy frontend to fabian-resume-site'
    pool:
      vmImage: 'ubuntu-latest'

    # Links this deployment to the "production" environment in
    # Azure DevOps — where the manual approval gate is configured.
    # NOTE: "production" here is the Azure DevOps environment name.
    # The Static Web App environment name is "default" — these are
    # two separate concepts. Azure DevOps environment = approval gate.
    # Static Web App environment = deployment slot.
    environment: 'production'

    strategy:
      runOnce:
        deploy:
          steps:

          # Pull the latest code onto the deployment agent
          - checkout: self
            displayName: 'Checkout source'

          # -------------------------------------------------------
          # ORIGINAL DEPLOY METHOD — AzureStaticWebApp@0 task
          # KEPT AS REFERENCE — DO NOT UNCOMMENT WITHOUT READING BELOW
          # -------------------------------------------------------
          # The AzureStaticWebApp@0 task was our original approach.
          # It failed consistently with:
          #   "No matching Static Web App was found or the api key was invalid"
          #
          # ROOT CAUSE: Azure Static Web Apps enforces repository linkage
          # when using this task. The Static Web App must be actively linked
          # to a GitHub or Azure DevOps repo for the task to authenticate.
          # After disconnecting GitHub via az staticwebapp disconnect, the
          # task had no registered repo to match against — causing the error
          # regardless of whether the token itself was valid.
          #
          # This is an Azure platform constraint, not a YAML or token issue.
          # The task is designed for managed pipelines where Azure controls
          # the repo connection. For custom pipelines, use swa CLI instead.
          #
          # - task: AzureStaticWebApp@0
          #   displayName: 'Deploy to Azure Static Web Apps (fabian-resume-site)'
          #   inputs:
          #     app_location: '$(frontendPath)'
          #     output_location: ''
          #     skip_api_build: true
          #     production_branch: 'main'
          #   env:
          #     azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
          # -------------------------------------------------------

          # -------------------------------------------------------
          # CURRENT DEPLOY METHOD — Azure Static Web Apps CLI (swa)
          # -------------------------------------------------------
          # The SWA CLI is the official Azure Static Web Apps command
          # line tool. Unlike the AzureStaticWebApp@0 task, it
          # authenticates purely via deployment token with no repository
          # linkage required — giving us full control over deployment
          # without Azure managing the pipeline for us.
          #
          # HOW IT WORKS:
          # 1. npm installs the SWA CLI globally on the agent
          # 2. swa deploy points at the frontend/ folder
          # 3. The deployment token from the variable group authenticates
          #    the agent to fabian-resume-site
          # 4. Files are uploaded directly to Azure Static Web Apps
          #
          # IMPORTANT — --env default vs --env production:
          # The Static Web App environment is named "default" not "production"
          # Confirmed via: az staticwebapp environment list
          # The production slot is called "default" when the Static Web App
          # has no source repo linked. Using --env production caused the same
          # "No matching Static Web App" error because that name doesn't exist.
          # -------------------------------------------------------

          # Step 1: Install the Azure Static Web Apps CLI
          # @latest ensures we always use the current stable version
          # The CLI is published as an npm package by Microsoft
          - script: |
              echo "=== Installing Azure Static Web Apps CLI ==="
              npm install -g @azure/static-web-apps-cli@latest
              echo "✓ SWA CLI installed"
              swa --version   # Print version to log for audit trail
            displayName: 'Install SWA CLI'

          # Step 2: Deploy frontend/ to fabian-resume-site
          # --app-location: the folder to deploy (frontend/)
          # --env default: the actual name of the production slot on
          #   this Static Web App — confirmed via environment list command.
          #   Do NOT change this to "production" — that environment does
          #   not exist and will cause a BadRequest error.
          # --deployment-token: injected from the variable group secret.
          #   Never hardcode this token — it grants write access to the site.
          - script: |
              echo "=== Deploying to Azure Static Web Apps ==="
              swa deploy $(frontendPath) \
                --env default \
                --deployment-token $(AZURE_STATIC_WEB_APPS_API_TOKEN)
            displayName: 'Deploy via SWA CLI'

          # -------------------------------------------------------
          # SUMMARY STEP
          # Prints deployment details to the log for audit trail.
          # Runs after successful deployment — shows exactly what
          # build number and commit SHA went to production.
          # -------------------------------------------------------
          - script: |
              echo "============================================"
              echo "  DEPLOYMENT COMPLETE"
              echo "============================================"
              echo "  Site:      https://fabianresume.dev"
              echo "  Build:     $(Build.BuildNumber)"
              echo "  Commit:    $(Build.SourceVersion)"
              echo "  Requested: $(Build.RequestedFor)"
              echo "  Time:      $(date -u)"
              echo "============================================"
            displayName: 'Deployment summary'